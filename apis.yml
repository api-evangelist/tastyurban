name: TastyUrban
description: >-
  TastyUrban is a Berlin-based virtual restaurant franchise and digital-first
  food-brand licensing company founded in 2022 by Felix Chrobog, Marc Hansell,
  and Gerry Pidgeon (alumni of Gorillas, Tier, and Deliveroo). It pursues an
  asset-light model in which existing restaurants and retail partners license
  and operate TastyUrban's digital food brands, using otherwise idle kitchen
  capacity to add revenue without major investment or operational complexity.
  The company is backed by Earlybird and raised a EUR 1.5M seed round in 2023
  and a EUR 6.5M Series A in 2025 (led by IBB Ventures). TastyUrban operates a
  consumer/partner web presence at tastyurban.com but publishes no public API,
  developer portal, or documentation surface at this time.
